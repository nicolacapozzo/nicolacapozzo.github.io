// overlays
let ov=null;const order=P.map(p=>p.id);
function shell(id,label,head){closeP(false);ov=document.createElement('div');ov.className='ov';ov.dataset.id=id;ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label',label);
 ov.innerHTML=`<div class="obar"><div class="wrap"><span class="mono" style="display:flex;gap:10px;align-items:center">${head}</span><span class="ctl">${id==='cv'?'':`<button class="ib" data-a="prev" aria-label="${T[L].prev}">←</button><button class="ib" data-a="next" aria-label="${T[L].next}">→</button>`}<button class="ib" data-a="close">${T[L].close} ✕</button></span></div></div><div class="ovb"></div>`;
 document.body.appendChild(ov);document.body.style.overflow='hidden';return ov.querySelector('.ovb')}
function pagesBlock(pages,title){const t=T[L];const pairs=[];for(let k=0;k<pages.length;k+=2)pairs.push(pages.slice(k,k+2));
 return `<div class="pg"><div class="grp"><span class="cond">${title}</span><span class="mono" style="color:var(--mute)">${t.pagesNote?t.pagesNote+' · ':''}pp. ${pages[0]}–${pages[pages.length-1]}</span></div>
  <div style="display:grid;gap:18px">${pairs.map(pr=>`<div class="strip">${pr.map(n=>`<button data-pg="${n}" aria-label="${n}"><img src="${pimg(n)}" alt="" loading="lazy"></button>`).join('')}</div>`).join('')}</div></div>`}
function openP(id,focus=true){
 const p=P.find(x=>x.id===id);if(!p)return;const d=D(p),t=T[L];const ch=CH.find(c=>c.k===p.ch);const ci=CH.indexOf(ch);
 const b=shell(id,d.title,`${sym(ch.sym,ch.c)} ${t.C[ci][L==='en'?1:2]} · ${pad(P.filter(x=>x.ch===p.ch).indexOf(p)+1)}`);
 const gl=GAL[p.id]||[['img/'+p.id+'.jpg',1.5]];
 b.innerHTML=`<div class="gal sld"><div class="trk">${gl.map(([s],k)=>`<div class="sl"><img src="${s}" alt="${esc(d.title)} ${k+1}" ${k>1?'loading="lazy"':''}></div>`).join('')}</div>
  ${gl.length>1?`<button class="nav p" data-g="-1" aria-label="${t.prev}">←</button><button class="nav n" data-g="1" aria-label="${t.next}">→</button>`:''}
  <span class="cnt">01 / ${pad(gl.length)}</span><span class="dots">${gl.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</span></div>
  <div class="wrap"><div class="body">
   <div class="side"><h2>${esc(d.title)}</h2><div class="subt">${esc(d.sub)}</div>
    <dl>${d.info.map(([k,v])=>`<div><dt class="cond">${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div>
   <div class="main"><span class="cond">${t.desc}</span><p style="margin-top:10px">${esc(d.desc)}</p>${d.note?`<div class="note"><span class="cond">${t.copyr}</span><br>${esc(d.note)}</div>`:''}</div>
  </div>${pagesBlock(p.pages,t.tav)}</div>`;
 setupGal(b);if(focus)ov.querySelector('[data-a="close"]').focus({preventScroll:true});
 try{history.replaceState(null,'','#'+id)}catch(e){}
}
function openCV(focus=true){
 const c=CV[L],t=T[L];
 const b=shell('cv',t.cvt,`00 · ${t.cvt}`);
 b.innerHTML=`<div class="wrap"><div class="cvgrid">
  <div class="l"><img src="img/photo.jpg" alt="Nicola Capozzo"><h2 style="margin:6px 0 0;font-size:clamp(30px,3.6vw,44px);line-height:1"><span style="font-weight:100">Nicola</span> <span style="font-weight:900">Capozzo</span></h2><div class="subt" style="color:var(--mute)">${t.role}</div>
   <dl style="margin:6px 0 0;border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:12px">${c.facts.map(([k,v])=>`<div><dt class="cond">${k}</dt><dd style="margin:0">${v}</dd></div>`).join('')}
   <div><dt class="cond">E-mail</dt><dd style="margin:0;user-select:all">nico.capozzo@libero.it</dd></div><div><dt class="cond">${t.tel}</dt><dd style="margin:0;user-select:all">+39 327 196 0867</dd></div></dl></div>
  <div class="r">
   <div><div class="cond">${c.L[0]}</div><p class="lead" style="font-size:clamp(18px,1.7vw,21px);font-weight:300;line-height:1.5;margin:10px 0 0;max-width:62ch">${c.profile}</p></div>
   ${c.S.map(([h,items])=>`<div><div class="cond" style="margin-bottom:10px">${h}</div><ul class="xp">${items.map(([y,a,s])=>`<li><span class="y">${y}</span><span><b>${a}</b><span class="s">${s}</span></span></li>`).join('')}</ul></div>`).join('')}
   <div><div class="cond" style="margin-bottom:12px">${c.L[2]}</div><ul class="skills">${SK.map(([k,v])=>`<li><span>${typeof k==='string'?k:k[L]}</span><span class="tr"><i style="left:${v*100}%"></i></span></li>`).join('')}</ul>
    <div class="mono" style="display:grid;grid-template-columns:150px 1fr;gap:12px;margin-top:8px;color:var(--mute)"><span></span><span style="display:flex;justify-content:space-between"><span>${c.lv[0]}</span><span>${c.lv[1]}</span><span>${c.lv[2]}</span></span></div></div>
   <div><div class="cond" style="margin-bottom:8px">${c.L[3]}</div><div>${c.soft}</div></div>
   <div><div class="cond" style="margin-bottom:8px">${c.L[4]}</div><div>${c.int}</div></div>
  </div></div>${pagesBlock([3,4,5],t.cvpages)}</div>`;
 if(focus)ov.querySelector('[data-a="close"]').focus({preventScroll:true});
 try{history.replaceState(null,'','#cv')}catch(e){}
}
function closeP(clear=true){if(ov){ov.remove();ov=null;document.body.style.overflow=''}if(clear)try{history.replaceState(null,'','#top')}catch(e){}}
document.addEventListener('click',e=>{
 const cn=e.target.closest('.cn');if(cn){e.stopPropagation();slide(cn.closest('.sld'),+cn.dataset.c);return}
 const c=e.target.closest('.card');if(c&&!dragMoved)return openP(c.dataset.id);
 if(!ov||!ov.contains(e.target))return;const b=e.target.closest('[data-a],[data-pg],[data-g]');if(!b)return;
 if(b.dataset.pg)return openLB(+b.dataset.pg);
 if(b.dataset.g)return galStep(+b.dataset.g);const a=b.dataset.a,i=order.indexOf(ov.dataset.id);
 if(a==='close')closeP();if(a==='prev')openP(order[(i-1+order.length)%order.length]);if(a==='next')openP(order[(i+1)%order.length]);});
document.getElementById('openCV').onclick=()=>openCV();
// lightbox
let lb=null,cur=1;const N=63;
const narrow=()=>matchMedia('(max-width:720px)').matches;
function spreadOf(n){if(narrow())return[n];if(n<=1)return[1];const l=n%2===0?n:n-1;return l+1<=N?[l,l+1]:[l]}
function renderLB(){const s=spreadOf(cur);lb.querySelector('.stage').innerHTML=s.map((n,k)=>`<img class="${s.length===1?'solo':(k?'r':'l')}" src="${pimg(n)}" alt="${n}">`).join('');lb.querySelector('.cnt').textContent=s.map(pad).join(' – ')+' / '+N+(T[L].pagesNote?' · '+T[L].pagesNote:'')}
function openLB(n){cur=n;if(!lb){lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-label','Portfolio');
 lb.innerHTML=`<div class="lt"><span class="mono cnt"></span><button class="ib" data-l="x">${T[L].close} ✕</button></div><div class="stage"></div><div class="lnav"><button class="ib" data-l="p">← ${T[L].prev}</button><button class="ib" data-l="n">${T[L].next} →</button></div>`;
 lb.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b){if(e.target===lb)closeLB();return}const a=b.dataset.l;if(a==='x')closeLB();if(a==='p')step(-1);if(a==='n')step(1)});
 document.body.appendChild(lb);document.body.style.overflow='hidden'}renderLB();lb.querySelector('[data-l="n"]').focus({preventScroll:true})}
function step(d){const s=spreadOf(cur);cur=d>0?Math.min(N,s[s.length-1]+1):Math.max(1,s[0]-1);renderLB()}
function closeLB(){if(lb){lb.remove();lb=null;if(!ov)document.body.style.overflow=''}}
document.getElementById('openBook').onclick=()=>openLB(1);document.getElementById('openBook2').onclick=()=>openLB(1);
document.addEventListener('keydown',e=>{if(!lb&&!ov&&e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){openP(e.target.dataset.id);return}if(lb){if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);return}if(ov&&e.key==='Escape')closeP();if(ov&&ov.dataset.id!=='cv'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();galStep(e.key==='ArrowRight'?1:-1)}});
let sx=null;document.addEventListener('touchstart',e=>{if(lb)sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(lb&&sx!==null){const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1)}sx=null},{passive:true});
// geometry drawing
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let geos=[],t0=performance.now(),raf=0;
function setupGeo(){geos=[...document.querySelectorAll('[data-geo]')].map(s=>({s,hero:s.dataset.geo==='hero',mk:[...s.querySelectorAll('.mk')],cl:s.querySelector('.cls'),t:null}));
 geos.forEach(g=>{g.mk.forEach(m=>{m.style.strokeDasharray='1';m.style.strokeDashoffset=RM?'0':'1'});if(g.cl)g.cl.style.opacity=RM?'1':'0'});
 if(RM){document.querySelectorAll('.band').forEach(b=>b.classList.add('play'));return}
 const ob='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const g=geos.find(x=>x.s===en.target);if(g&&g.t===null){g.t=performance.now();g.s.classList.add('play');tick()}ob.unobserve(en.target)}}),{threshold:.45}):null;
 geos.forEach(g=>{if(ob)ob.observe(g.s);else{g.t=performance.now();g.s.classList.add('play')}});tick()}
function tick(){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function frame(now){let again=false;
 geos.forEach(g=>{if(g.t===null)return;const D=g.hero?11000:9000;let p=Math.min(1,(now-g.t)/D);if(p<1)again=true;
  g.mk.forEach((m,i)=>{const q=Math.max(0,Math.min(1,(p-i*.25)/.5));const e=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;m.style.strokeDashoffset=String(1-e)});
  if(g.cl)g.cl.style.opacity=String(Math.max(0,Math.min(1,p*1.4-.1)));});
 if(again)raf=requestAnimationFrame(frame)}

applyLang();
const h=(location.hash||'').slice(1);if(order.includes(h))openP(h,false);else if(h==='cv')openCV(false);

function loadFx(root){root.querySelectorAll('img').forEach(im=>{if(im.complete&&im.naturalWidth)requestAnimationFrame(()=>im.classList.add('ld'));else im.addEventListener('load',()=>im.classList.add('ld'),{once:true})})}
function setupGal(b){const g=b.querySelector('.gal');if(!g)return;loadFx(g);slide(g,0,0)}
function galStep(d){const g=ov&&ov.querySelector('.gal');if(g)slide(g,d)}
function slide(s,d,abs){const tr=s.querySelector('.trk'),n=tr.children.length;let k=abs!==undefined?abs:((s._k||0)+d+n)%n;s._k=k;tr.style.transform=`translateX(${-100*k}%)`;
 s.querySelectorAll('.cd i,.dots i').forEach((x,j)=>x.classList.toggle('on',j===k));const c=s.querySelector('.cnt');if(c)c.textContent=pad(k+1)+' / '+pad(n);
 [...tr.children].forEach((c,j)=>{c.classList.toggle('cur',j===k);if(Math.abs(j-k)<=2){const im=c.tagName==='IMG'?c:c.querySelector('img');if(im&&im.loading==='lazy')im.loading='eager'}})}
let dragMoved=false;
(function(){let st=null;
 document.addEventListener('pointerdown',e=>{const s=e.target.closest('.sld');if(!s||e.target.closest('button.cn,.nav'))return;const tr=s.querySelector('.trk');if(tr.children.length<2)return;st={s,tr,x:e.clientX,y:e.clientY,w:s.clientWidth,on:false};dragMoved=false},{passive:true});
 document.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.on){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){st.on=true;dragMoved=true;st.tr.classList.add('drag')}else if(Math.abs(dy)>10){st=null;return}else return}
  st.tr.style.transform=`translateX(calc(${-100*(st.s._k||0)}% + ${dx}px))`},{passive:true});
 const end=e=>{if(!st)return;const dx=(e.clientX||st.x)-st.x;st.tr.classList.remove('drag');if(st.on){slide(st.s,Math.abs(dx)>st.w*.15?(dx<0?1:-1):0)}st=null;setTimeout(()=>dragMoved=false,30)};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);})();
function fitWord(){const w=document.getElementById('word');if(!w)return;const s=w.children;w.style.marginLeft='0px';w.style.fontSize='200px';
 const cv=document.createElement('canvas').getContext('2d');cv.font='900 200px Roboto, system-ui, sans-serif';const mP=cv.measureText('P'),mo=cv.measureText('o');
 const l=s[0].getBoundingClientRect().left+(-mP.actualBoundingBoxLeft),r=s[s.length-1].getBoundingClientRect().left+mo.actualBoundingBoxRight;
 const vw=document.documentElement.clientWidth,f=200*vw*1.0/(r-l);w.style.fontSize=f+'px';
 const k=f/200,l2=s[0].getBoundingClientRect().left+(-mP.actualBoundingBoxLeft*k),r2=s[s.length-1].getBoundingClientRect().left+mo.actualBoundingBoxRight*k;
 w.style.marginLeft=(-(l2+r2)/2+vw/2)+'px'}
fitWord();addEventListener('resize',fitWord);document.fonts&&document.fonts.ready.then(fitWord);setTimeout(fitWord,1500);
var io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'}):null;
function cardsFx(){loadFx(document.getElementById('chapters'));document.querySelectorAll('.card .sld').forEach(s=>slide(s,0,0));if(!io||RM)return;document.querySelectorAll('.card').forEach((c,i)=>{const r=c.getBoundingClientRect();if(r.top>innerHeight){c.classList.add('pre');c.style.transitionDelay=(i%3)*90+'ms';io.observe(c)}})}
cardsFx();



document.addEventListener('pointerover',e=>{const s=e.target.closest&&e.target.closest('.sld');if(s&&!s._pre){s._pre=1;s.querySelectorAll('img[loading="lazy"]').forEach(i=>i.loading='eager')}},{passive:true});

</script>

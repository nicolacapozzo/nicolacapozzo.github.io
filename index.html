<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Portfolio di Nicola Capozzo, architetto. Selezione di lavori 2013–2026.">
<meta property="og:title" content="Nicola Capozzo · Portfolio">
<meta property="og:description" content="Architetto · Selezione di lavori 2013–2026">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nicola Capozzo Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;900&family=Roboto+Mono:wght@400;500&family=Roboto+Condensed:wght@500&display=swap">
<style>
/* Layout: black book covers frame white "pages"; a 12-col editorial grid with the same mono labels, thin/black titles and dash-dot geometry as the printed portfolio */
:root{
  --ink:#111111; --paper:#FFFFFF; --night:#0B0B0B; --mute:#777777; --rule:#DADADA; --line:#3A3A3A; --ghost:#2A2A2A;
  --acc:#F2B52A; --tes:#2E9DB8; --pro:#2B78B5;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-cond:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cond{font-family:var(--f-cond);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--night);color:#F2F2F2;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.bar .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-decoration:none}
.bar nav{display:flex;gap:clamp(12px,2.4vw,32px);flex-wrap:wrap;justify-content:flex-end}
.bar nav a{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#9A9A9A;transition:color .2s}
.bar nav a:hover,.bar nav a:focus-visible{color:#fff}
.bar nav .n{color:#5E5E5E;margin-right:6px}
@media (max-width:640px){.bar nav .t{display:none}.bar nav a{font-size:12px}}
/* hero */
.hero{background:var(--night);color:#F2F2F2;position:relative;overflow:hidden}
.hero svg.geo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.geo .fig{fill:none;stroke:#2E2E2E;stroke-width:1.1;stroke-dasharray:22 7 2 7;vector-effect:non-scaling-stroke}
.geo .cl{stroke:#232323;stroke-width:1;stroke-dasharray:5 7;vector-effect:non-scaling-stroke}
.hero .inner{position:relative;padding-block:clamp(28px,5vw,56px) clamp(28px,4vw,48px)}
.hero .top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;color:#8A8A8A}
.word{font-weight:900;line-height:.8;letter-spacing:-.03em;white-space:nowrap;margin:clamp(70px,13vw,170px) 0 clamp(54px,9vw,120px);font-size:25vw;position:relative}
.word span{display:inline-block;animation:ltr .9s cubic-bezier(.2,.75,.2,1) both}
@keyframes ltr{from{opacity:0;transform:translateY(.18em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.name{font-size:clamp(34px,5.4vw,68px);line-height:1;letter-spacing:-.01em}
.name .t{font-weight:100}.name .b{font-weight:900}
.hero .base{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-top:10px}
.hero .base .role{font-weight:300;font-size:clamp(16px,1.6vw,20px);color:#8A8A8A}
.hero .base .mono{color:#8A8A8A}
@keyframes rise{from{transform:translateY(.12em);opacity:.0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.geo .fig{animation:draw 3.2s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* sections */
section.sec{padding-block:clamp(56px,8vw,110px)}
.head{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;border-top:1px solid var(--ink);padding-top:16px;margin-bottom:clamp(28px,4vw,48px)}
.head .lbl{grid-column:span 3}
.head h2{grid-column:span 9;margin:0;font-size:clamp(34px,4.6vw,60px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.head h2 .t{font-weight:100}.head h2 .b{font-weight:900}
@media (max-width:720px){.head{grid-template-columns:1fr}.head .lbl,.head h2{grid-column:auto}}
/* profile */
.prof{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.prof .ph{grid-column:span 3}
.prof .ph img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1);display:block}
.prof .facts{display:grid;gap:14px;margin-top:20px}
.prof .facts div{display:grid;gap:2px}
.prof .txt{grid-column:5 / span 8;min-width:0}
.prof .lead{font-size:clamp(19px,1.9vw,24px);font-weight:300;line-height:1.45;margin:0 0 32px;max-width:62ch}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.cols h3{margin:0 0 10px}
.xp{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.xp li{display:grid;grid-template-columns:96px 1fr;gap:12px;border-top:1px solid var(--rule);padding-top:10px}
.xp .y{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.xp b{font-weight:500;display:block}.xp span.s{color:var(--mute);font-size:14px}
.skills{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.skills li{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;font-size:14px}
.skills .tr{position:relative;height:12px;border-bottom:1px dotted #BDBDBD}
.skills .tr i{position:absolute;top:2px;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
@media (max-width:860px){.prof .ph{grid-column:span 12;max-width:340px}.prof .txt{grid-column:span 12}.cols{grid-template-columns:1fr}}
/* chapter band */
.band{background:var(--night);color:#F2F2F2;position:relative;overflow:hidden}
.band .inner{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;padding-block:clamp(40px,6vw,80px) clamp(28px,4vw,44px);position:relative}
.band .num{grid-column:span 5;font-weight:900;font-size:clamp(110px,17vw,240px);line-height:.78;letter-spacing:-.04em;margin-left:-.06em}
.band .ttl{grid-column:span 7;display:grid;gap:12px;padding-bottom:6px}
.band .ttl h2{margin:0;font-size:clamp(32px,4.4vw,58px);line-height:1}
.band .ttl h2 .t{font-weight:100}.band .ttl h2 .b{font-weight:900}
.band .ttl .mono{color:#8A8A8A;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.band .sym{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:24px}
@media (max-width:720px){.band .num,.band .ttl{grid-column:span 12}}
/* project grid */
.grp{margin:clamp(36px,5vw,56px) 0 18px;display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.4vw,32px) clamp(14px,1.8vw,24px)}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{all:unset;cursor:pointer;display:grid;gap:10px;min-width:0}
.card .im{position:relative;aspect-ratio:4/3;overflow:hidden;background:#EDEDED}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card .im .go{position:absolute;left:12px;bottom:12px;background:var(--paper);color:var(--ink);padding:6px 9px;transform:translateY(8px);opacity:0;transition:.35s}
.card:hover .im img,.card:focus-visible .im img{transform:scale(1.045)}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.card .meta{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.card h3{margin:0;font-size:19px;font-weight:500;line-height:1.25;text-wrap:balance}
.card .yr{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.card .sub{grid-column:1 / -1;color:var(--mute);font-size:14px;font-weight:300}
.card .pr{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:#9A9A9A}
/* book */
.book{background:#EFEFED}
.book .row{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:center}
.book .cov{grid-column:span 6;all:unset;cursor:pointer;grid-column:span 6;display:block;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);transition:transform .5s}
.book .cov:hover{transform:translateY(-6px) rotate(-.4deg)}
.book .cov img{display:block;width:100%}
.book .tx{grid-column:8 / span 5;display:grid;gap:18px}
.btn{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);padding:12px 16px;justify-self:start}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
@media (max-width:860px){.book .cov,.book .tx{grid-column:span 12}}
footer{background:var(--night);color:#BDBDBD}
footer .wrap{padding-block:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
footer .v{font-size:15px;color:#F2F2F2;user-select:all}
@media (max-width:720px){footer .wrap{grid-template-columns:1fr}}
/* project overlay */
.ov{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .45s cubic-bezier(.2,.7,.2,1)}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.ov .obar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule)}
.ov .obar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px}
.ov .obar .ctl{display:flex;gap:8px}
.ib{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1px solid var(--rule)}
.ib:hover,.ib:focus-visible{border-color:var(--ink)}
.ov .hero2{width:100%;aspect-ratio:21/9;max-height:62vh;object-fit:cover;display:block;background:#EEE}
.ov .body{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding-block:clamp(28px,4vw,48px)}
.ov .side{grid-column:span 4;display:grid;gap:14px;align-content:start}
.ov .side .sym{display:flex;gap:8px;align-items:center}
.ov h2{margin:4px 0 0;font-size:clamp(30px,3.6vw,46px);font-weight:300;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.ov .subt{color:var(--mute);font-weight:300;margin-top:-6px}
.ov dl{margin:8px 0 0;border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:12px}
.ov dl div{display:grid;gap:1px}.ov dd{margin:0}
.ov .main{grid-column:6 / span 7;min-width:0}
.ov .main p{font-size:clamp(17px,1.5vw,19px);line-height:1.6;margin:0 0 20px;max-width:62ch;font-weight:300}
.ov .note{border-top:1px solid var(--rule);padding-top:12px;color:var(--mute);font-size:13px;max-width:62ch}
.ov .pg{padding-bottom:56px}
.ov .pg .strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#E6E6E4;padding:4px}
.ov .pg button{all:unset;cursor:zoom-in;display:block}
.ov .pg img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
@media (max-width:860px){.ov .side,.ov .main{grid-column:span 12}.ov .hero2{aspect-ratio:4/3}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(11,11,11,.96);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.lb .lt{display:flex;justify-content:space-between;align-items:center;color:#9A9A9A;padding-block:12px}
.lb .stage{display:flex;align-items:center;justify-content:center;gap:4px;min-height:0}
.lb .stage img{max-height:100%;max-width:50%;object-fit:contain;background:#fff}
.lb .stage img.solo{max-width:100%}
.lb .lnav{display:flex;justify-content:center;gap:10px;padding-block:12px}
.lb .ib{color:#DDD;border-color:#3A3A3A}
.lb .ib:hover{border-color:#DDD}
@media (max-width:720px){.lb .stage img{max-width:100%}}

.lang{display:flex;border:1px solid var(--line)}
.lang button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;padding:5px 8px;color:#7A7A7A}
.lang button[aria-pressed="true"]{background:#F2F2F2;color:var(--night)}
.lang button:focus-visible{outline:1px solid #fff}
.bar .right{display:flex;align-items:center;gap:clamp(12px,2.4vw,28px)}
.geo .fig{animation:none;stroke:#4C4C4C;stroke-width:1;stroke-dasharray:22 7 2 7}
.geo .cl{stroke:#2C2C2C;stroke-width:1}
.geo .cl{transition:opacity .6s}
.band .geo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band .inner{z-index:1}
.cvteaser{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:start}
.cvteaser .ph{grid-column:span 3}
.cvteaser .ph img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1);display:block}
.cvteaser .tx{grid-column:5 / span 8;display:grid;gap:22px;min-width:0}
.cvteaser .lead{font-size:clamp(19px,1.9vw,24px);font-weight:300;line-height:1.45;margin:0;max-width:62ch}
.cvteaser .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:860px){.cvteaser .ph{grid-column:span 12;max-width:320px}.cvteaser .tx{grid-column:span 12}.cvteaser .kv{grid-template-columns:1fr}}
.cvgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding-block:clamp(28px,4vw,48px)}
.cvgrid .l{grid-column:span 4;display:grid;gap:14px;align-content:start}
.cvgrid .r{grid-column:6 / span 7;display:grid;gap:34px;min-width:0}
.cvgrid .l img{width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;filter:grayscale(1)}
@media (max-width:860px){.cvgrid .l,.cvgrid .r{grid-column:span 12}}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px}
.ovnote{color:var(--mute);font-size:13px}

.card .im img{opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.2,.7,.2,1)}
.card .im img.ld{opacity:1;transform:scale(1)}
.card:hover .im img.ld,.card:focus-visible .im img.ld{transform:scale(1.04)}
.card{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.card.pre{transform:translateY(34px)}
.gal{position:relative;background:#EEEEEC}

.gal .track::-webkit-scrollbar{display:none}

.gal .sl img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .9s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.gal .sl img.ld{opacity:1;transform:none}
.gal .ga{position:absolute;top:50%;transform:translateY(-50%);all:unset;cursor:pointer}
.gal .nav{position:absolute;top:50%;translate:0 -50%;width:46px;height:46px;border:1px solid rgba(17,17,17,.25);background:rgba(255,255,255,.85);display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;cursor:pointer;transition:background .25s}
.gal .nav:hover,.gal .nav:focus-visible{background:#fff;border-color:var(--ink)}
.gal .nav.p{left:max(12px,env(safe-area-inset-left,0px))}.gal .nav.n{right:max(12px,env(safe-area-inset-right,0px))}
.gal .cnt{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;background:rgba(255,255,255,.85);padding:5px 8px}
.gal .dots{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;gap:6px}
.gal .dots i{width:18px;height:2px;background:rgba(17,17,17,.25);transition:background .3s,width .3s}
.gal .dots i.on{background:var(--ink);width:30px}
@media (max-width:720px){.gal .track{height:58vh}.gal .nav{display:none}}


.sld{position:relative;overflow:hidden;touch-action:pan-y}
.sld .trk{display:flex;height:100%;will-change:transform;transition:transform .7s cubic-bezier(.22,.61,.36,1)}
.sld .trk>*>img,.sld .trk>img{transition:opacity .6s ease,transform .9s cubic-bezier(.22,.61,.36,1)!important}
.sld .trk>.cur img,.sld .trk>img.cur{transform:scale(1)!important}
.sld .trk>:not(.cur) img{transform:none!important}
.sld .trk>img:not(.cur){transform:none!important}
.sld .trk>*{overflow:hidden}
.card .im .trk>img{clip-path:inset(0)}
.sld .trk.drag{transition:none}
.sld .trk>*{flex:0 0 100%;min-width:0}
.card .im .trk img{width:100%;height:100%;object-fit:cover;display:block}
.card .cn{position:absolute;top:50%;translate:0 -50%;width:34px;height:34px;display:grid;place-items:center;background:rgba(255,255,255,.9);border:0;font-family:var(--f-mono);font-size:14px;cursor:pointer;opacity:0;transition:opacity .5s;z-index:2}
.card .cn.p{left:10px}.card .cn.n{right:10px}
.card:hover .cn,.card:focus-within .cn{opacity:1}
.card .cd{position:absolute;right:12px;bottom:14px;display:flex;gap:4px;z-index:2}
.card .cd i{width:10px;height:2px;background:rgba(255,255,255,.55);transition:width .9s cubic-bezier(.65,.02,.2,1),background .9s}
.card .cd i.on{width:22px;background:#fff}
@media (hover:none){.card .cn{display:none}}
.gal .trk{height:min(66vh,720px)}
.gal .sl{display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vw,28px)}
.gal .dots i{transition:background .9s,width .9s cubic-bezier(.65,.02,.2,1)}
@media (max-width:720px){.gal .trk{height:58vh}}

.band .num span,.band .ttl h2 span.w,.band .ttl .mono{display:inline-block}
.band:not(.play) .num span,.band:not(.play) .ttl h2 .w,.band:not(.play) .ttl .mono{opacity:0}
.band.play .num span{animation:ltr 1.1s cubic-bezier(.2,.75,.2,1) both}
.band.play .ttl h2 .w{animation:ltr 1s cubic-bezier(.2,.75,.2,1) both}
.band.play .ttl .mono{animation:fadeup 1s ease both;animation-delay:1.1s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.band .ttl .mono{display:flex}
</style>
</head>

<header class="bar"><div class="wrap">
 <a class="who" href="#top">NICOLA CAPOZZO</a>
 <div class="right">
 <nav aria-label="Sezioni">
  <a href="#profilo"><span class="n">00</span><span class="t" data-i="nav0"></span></a>
  <a href="#accademici"><span class="n">01</span><span class="t" data-i="ch1"></span></a>
  <a href="#tesi"><span class="n">02</span><span class="t" data-i="ch2"></span></a>
  <a href="#professionali"><span class="n">03</span><span class="t" data-i="ch3"></span></a>
 </nav>
 <div class="lang" role="group" aria-label="Lingua / Language"><button data-lang="it" aria-pressed="true">IT</button><button data-lang="en" aria-pressed="false">EN</button></div>
 </div>
</div></header>

<section class="hero" id="top" data-geo="hero">
 <svg class="geo" viewBox="0 0 100 100" preserveAspectRatio="xMidYMin slice" aria-hidden="true">

<script>
const P=[{"id": "mater", "ch": "acc", "title": "MATER[I]A", "sub": "Auditorium", "year": "2015/16", "info": [["LUOGO · ANNO", "Matera · 2015/2016"], ["ISTITUZIONE", "Politecnico di Bari"], ["CORSO", "Design Studio III"], ["DOCENTE · TUTOR", "Prof. Giuseppe Fallacara"]], "desc": "Il progetto si inserisce nel nuovo complesso museale multifunzionale pensato per Matera Capitale Europea della Cultura 2019 e ne sviluppa il teatro al chiuso. La sala, a platea e galleria, si dispone attorno a un palcoscenico con quinta sfaccettata; una facciata vetrata, schermata da elementi lineari, rapporta l'ingresso al contesto, mentre la struttura combina travi in acciaio e orditura lignea. Ai piani inferiori trovano posto servizi, camerini e locali tecnici. Per la volta della sala è stato scritto uno script Grasshopper che suddivide la superficie in moduli e ne modula la profondità con un punto attrattore: i pannelli acustici ne derivano come elementi variabili ma ripetibili, per controllare le riflessioni verso la platea.", "note": null, "pages": [8, 9], "group": null, "blur": false, "en": {"title": "MATER[I]A", "sub": "Auditorium", "info": [["LOCATION · YEAR", "Matera · 2015/2016"], ["INSTITUTION", "Politecnico di Bari"], ["COURSE", "Design Studio III"], ["PROFESSOR · TUTOR", "Prof. Giuseppe Fallacara"]], "desc": "The project belongs to a new multifunctional museum complex conceived for Matera, European Capital of Culture 2019, and develops its indoor theatre. The hall, with stalls and a gallery, is arranged around a stage framed by a faceted proscenium; a glazed façade, screened by linear elements, mediates between the entrance and its surroundings, while the structure combines steel beams with a timber frame. Services, dressing rooms and plant rooms occupy the lower floors. For the ceiling vault, a Grasshopper script divides the surface into modules and varies their depth around an attractor point: the acoustic panels that result are all different yet repeatable, shaping how sound is reflected back towards the audience.", "note": null}}, {"id": "kube", "ch": "acc", "title": "KUBE MUZ", "sub": "Museo", "year": "2016/17", "info": [["LUOGO · ANNO", "Aveiro · 2016/2017"], ["ISTITUZIONE", "School of Architecture, Coimbra"], ["CORSO", "Project Atelier"], ["DOCENTE · TUTOR", "Prof. Paulo Sousa"]], "desc": "Il progetto per il museo del waterfront di Aveiro assume il cubo come concept: larghezza, profondità e altezza sono uguali e il museo si presenta come un volume unitario e compatto. L'involucro è un rivestimento di pannelli di alluminio a giunti verticali, che ne alleggerisce la massa; solo al piano terra la facciata si apre con una vetrata verso la piazza. All'interno l'immagine si ribalta: lo spazio espositivo è scandito da setti in calcestruzzo a vista, quasi sculture, e tagli di luce naturale lo alleggeriscono, mantenendo l'ambiente pulito a fronte della sua apparente pesantezza materica. Un nucleo di scale, ascensore e servizi lungo un lato libera il resto della pianta. Cinque livelli: due di mostre permanenti, uno di mostre temporanee, un piccolo auditorium e, in copertura, lounge e bar con un'ampia terrazza panoramica sulla città.", "note": null, "pages": [10, 11], "group": null, "blur": false, "en": {"title": "KUBE MUZ", "sub": "Museum", "info": [["LOCATION · YEAR", "Aveiro · 2016/2017"], ["INSTITUTION", "School of Architecture, Coimbra"], ["COURSE", "Project Atelier"], ["PROFESSOR · TUTOR", "Prof. Paulo Sousa"]], "desc": "Designed for Aveiro's waterfront, the museum takes the cube as its concept: width, depth and height are equal, and the building reads as a single, compact volume. Aluminium panels with vertical joints clad the envelope and lighten its mass; only at ground level does the façade open up, with full-height glazing onto the square. Inside, the image is reversed: the galleries are shaped by fair-faced concrete walls, almost sculptures, while cuts of daylight keep the space calm despite its apparent material weight. A core of stairs, lift and services along one side leaves the rest of the plan free. Five levels hold two floors of permanent collections, one of temporary exhibitions, a small auditorium and, on the roof, a lounge bar with a wide terrace overlooking the city.", "note": null}}, {"id": "agg", "ch": "acc", "title": "Aggregate Stage", "sub": "Padiglione", "year": "2021", "info": [["LUOGO · ANNO", "Pisa · 2021"], ["ISTITUZIONE", "Università di Pisa"], ["CORSO", "Workshop Data-Driven Additive Morphologies"], ["DOCENTI · TUTOR", "A. Figliola, M. Barberio, A. Rossi, M. Pellegrino"]], "desc": "Aggregate Stage è il lavoro finale di un workshop online ospitato dall'Università di Pisa: un piccolo padiglione, pensato per la corte interna dell'ateneo, la cui forma è più trovata che disegnata. Si parte da una ricerca di forma sviluppata con Kangaroo; dalla superficie ottenuta il progetto passa alla materia, riducendo tutto a un unico modulo, un nodo a sei bracci, aggregato nello spazio con Wasp fino a comporre una trama leggera e traforata, in dialogo con i portici della corte. Con Ladybug la forma ottenuta è stata sottoposta ad analisi climatiche, di radiazione solare e di vento, a partire dai dati di Pisa. Il modulo, stampato in 3D, chiude il percorso: dal dato alla forma, dalla forma all'oggetto.", "note": null, "pages": [12, 13], "group": null, "blur": false, "en": {"title": "Aggregate Stage", "sub": "Pavilion", "info": [["LOCATION · YEAR", "Pisa · 2021"], ["INSTITUTION", "University of Pisa"], ["COURSE", "Workshop Data-Driven Additive Morphologies"], ["PROFESSORS · TUTORS", "A. Figliola, M. Barberio, A. Rossi, M. Pellegrino"]], "desc": "Aggregate Stage is the final project of an online workshop hosted by the University of Pisa: a small pavilion for the university's inner courtyard, whose form is found rather than drawn. It starts with a form-finding study in Kangaroo; from the resulting surface the design moves to matter, reducing everything to a single module, a six-armed node, aggregated in space with Wasp into a light, perforated lattice that answers the arcades of the courtyard. Ladybug was then used to test the form against Pisa's climate data, with solar radiation and wind analyses. A 3D-printed module completes the process: from data to form, and from form to object.", "note": null}}, {"id": "kaizen", "ch": "tesi", "title": "Self Made Architecture VI", "sub": "Kaizen Pavilion", "year": "2021–22", "info": [["LUOGO · ANNO", "Black Rock City, Nevada · 2021–2022"], ["ISTITUZIONE", "Politecnico di Bari · FabLab PoliBa"], ["CORSO", "Laboratorio di Tesi Magistrale in Design generativo e additivo in architettura"], ["DOCENTE · TUTOR", "Nicola Parisi, Angelo Graziano, Andrea Rossi"]], "desc": "La tesi Self Made Architecture VI esplora l'autocostruzione come risorsa per portare il progetto fino alla realizzazione fisica delle forme, grazie alle competenze della fabbricazione digitale. L'idea è costruire grandi strutture assemblando a secco tanti piccoli elementi: un principio tradizionale, riletto con un approccio parametrico, tridimensionale e generativo. Il Kaizen Pavilion, ideato per il Burning Man 2023 nel deserto di Black Rock, in Nevada, ne è l'applicazione concreta. È composto da un unico modulo, un ottaedro troncato, poliedro che riempie lo spazio tridimensionale per traslazioni, rotazioni e riflessioni. Con Wasp le superfici scelte nella ricerca della forma vengono tassellate con questo modulo, ottenendo un padiglione modulare e adattabile, la cui forma risponde alle prestazioni richieste.", "note": null, "pages": [16, 17, 18, 19, 20, 21, 22, 23], "group": null, "blur": false, "en": {"title": "Self Made Architecture VI", "sub": "Kaizen Pavilion", "info": [["LOCATION · YEAR", "Black Rock City, Nevada · 2021–2022"], ["INSTITUTION", "Politecnico di Bari · FabLab PoliBa"], ["COURSE", "Master's thesis studio in generative and additive design in architecture"], ["PROFESSOR · TUTOR", "Nicola Parisi, Angelo Graziano, Andrea Rossi"]], "desc": "The Self Made Architecture VI thesis explores self-build as a way of carrying a design all the way to the physical making of its forms, through the skills of digital fabrication. The idea is to build large structures by dry-assembling many small elements: a traditional principle, reinterpreted through a parametric, three-dimensional and generative approach. The Kaizen Pavilion, conceived for Burning Man 2023 in the Black Rock Desert, Nevada, puts this into practice. It is made of a single module, a truncated octahedron, a polyhedron that fills three-dimensional space through translation, rotation and reflection. Using Wasp, the surfaces chosen during form-finding are tessellated with this module, producing a modular, adaptable pavilion whose shape responds to the required performance.", "note": null}}, {"id": "mini", "ch": "tesi", "title": "MINI – Inhabit Sound", "sub": "Padiglione acustico", "year": "2023", "info": [["LUOGO · ANNO", "Milano · 2023 · ADI Design Museum"], ["ISTITUZIONE", "SOS – School of Sustainability"], ["CORSO", "Progetto di tesi · Master in Architettura e Design Sostenibili"], ["DOCENTE · TUTOR", "Renzo Vitale"], ["TEAM", "Carlo Caire, Nicola Capozzo, Ruben Enrique Garrido Rizk, Flavia Torretta"]], "desc": "Inhabit Sound – Urban Acoustic Sustainability è un padiglione acustico realizzato da MINI con SOS – School of Sustainability e presentato all'ADI Design Museum di Milano nel 2023. Nasce come iniziativa per sensibilizzare sull'inquinamento acustico e immaginare città più silenziose e meno stressanti, trasformando la percezione del suono in uno spazio da attraversare. Il progetto usa materiali e tecniche sostenibili: bambù, truciolare riciclato al 100% prodotto da Saib e il tessuto fonoassorbente Snowsound. La struttura è modulare e scalabile e si smonta con facilità, così che i materiali possano essere riutilizzati.", "note": null, "pages": [24, 25, 26, 27], "group": null, "blur": false, "en": {"title": "MINI – Inhabit Sound", "sub": "Acoustic pavilion", "info": [["LOCATION · YEAR", "Milan · 2023 · ADI Design Museum"], ["INSTITUTION", "SOS – School of Sustainability"], ["COURSE", "Thesis project · Master's in Sustainable Architecture and Design"], ["PROFESSOR · TUTOR", "Renzo Vitale"], ["TEAM", "Carlo Caire, Nicola Capozzo, Ruben Enrique Garrido Rizk, Flavia Torretta"]], "desc": "Inhabit Sound – Urban Acoustic Sustainability is an acoustic pavilion created by MINI with SOS – School of Sustainability and presented at the ADI Design Museum in Milan in 2023. It began as an initiative to raise awareness of noise pollution and to imagine quieter, less stressful cities, turning the perception of sound into a space you can walk through. The project relies on sustainable materials and techniques: bamboo, 100% recycled chipboard produced by Saib and Snowsound sound-absorbing fabric. The structure is modular and scalable, and comes apart easily so that its materials can be reused.", "note": null}}, {"id": "poe", "ch": "prof", "title": "Part of Eight", "sub": "Capsule collection · Parquet design", "year": "2023", "info": [["LUOGO · ANNO", "2023"], ["STUDIO", "Libero professionista · per Mardegan Legno"], ["FASE", "Concept e design di prodotto"], ["RUOLO", "Designer"], ["AMBITO", "Design del parquet · Bihoma Green Collection"]], "desc": "Ricoprire un piano con un solo tassello è un problema matematico che interessa l'uomo fin dall'antichità, anche per la qualità estetica di mosaici e pavimenti. Le soluzioni più note usano triangoli, quadrati, rettangoli o esagoni. E i pentagoni? Il problema, aperto dal 1918, è stato chiuso da Michaël Rao, del Laboratoire d'informatique du parallélisme di Lione: con il calcolo ha dimostrato che i pentagoni convessi in grado di tassellare il piano sono solo 15 tipi. Part of Eight, capsule realizzata per Mardegan Legno, parte da qui: un parquet fatto di pentagoni non regolari usati come tasselli modulari, generati con un procedimento parametrico a partire da un unico pentagono.", "note": null, "pages": [30, 31], "group": "Collaborazioni", "blur": false, "en": {"title": "Part of Eight", "sub": "Capsule collection · Parquet design", "info": [["LOCATION · YEAR", "2023"], ["PRACTICE", "Freelance · for Mardegan Legno"], ["PHASE", "Concept and product design"], ["ROLE", "Designer"], ["SCOPE", "Parquet design · Bihoma Green Collection"]], "desc": "Covering a plane with a single tile is a mathematical problem that has fascinated people since antiquity, not least for the beauty of mosaics and floors. The best-known solutions use triangles, squares, rectangles or hexagons. What about pentagons? The question, open since 1918, was settled by Michaël Rao of the Laboratoire de l'informatique du parallélisme in Lyon, who proved by computation that only 15 types of convex pentagon can tile the plane. Part of Eight, a capsule collection designed for Mardegan Legno, starts from here: a parquet made of irregular pentagons used as modular tiles, generated parametrically from a single pentagon.", "note": null}}, {"id": "ess", "ch": "prof", "title": "Esselunga", "sub": "Superstore · nuovo concept", "year": "2023–24", "info": [["LUOGO · ANNO", "Milano · 2023–2024"], ["STUDIO", "Mario Cucinella Architects"], ["FASE", "Concept, PFTE, progetto definitivo"], ["RUOLO", "Progettista · Team member"], ["AMBITO", "Involucro esterno, lobby, Bar Atlantic, area vendite"]], "desc": "Il progetto riguarda il nuovo concept dei Superstore di Esselunga: un nuovo disegno sia per l'involucro esterno sia per gli spazi interni, tra cui la lobby, il Bar Atlantic e l'area vendite. Il progetto ha visto il contributo del team di progetto MCA nella progettazione e nella modellazione.", "note": "Immagini di proprietà di MCA – Mario Cucinella Architects, protette da copyright. Il progetto è ancora in fase di sviluppo e non è stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [32, 33], "group": "MCA · Mario Cucinella Architects", "blur": true, "en": {"title": "Esselunga", "sub": "Superstore · new concept", "info": [["LOCATION · YEAR", "Milan · 2023–2024"], ["PRACTICE", "Mario Cucinella Architects"], ["PHASE", "Concept, PFTE, final design"], ["ROLE", "Architect · Team member"], ["SCOPE", "Exterior envelope, lobby, Bar Atlantic, sales floor"]], "desc": "The project concerns the new concept for Esselunga's Superstores: a new design for both the exterior envelope and the interiors, including the lobby, the Bar Atlantic and the sales floor. The MCA design team contributed to both its design and its 3D modelling.", "note": "Images © MCA – Mario Cucinella Architects, protected by copyright. The project is still in development and has not been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "bbs", "ch": "prof", "title": "Bologna Business School", "sub": "Variante al progetto definitivo", "year": "2024", "info": [["LUOGO · ANNO", "Bologna · 2024"], ["STUDIO", "Mario Cucinella Architects"], ["FASE", "Variante al progetto definitivo"], ["RUOLO", "Progettista · Modellatore"], ["AMBITO", "Recinzione e due cancelli d'ingresso"]], "desc": "Il progetto riguarda la variante al progetto definitivo per la Bologna Business School. Il contributo ha riguardato la modellazione e la progettazione per il completamento della recinzione e dei due cancelli d'ingresso.", "note": "Immagini di proprietà di MCA – Mario Cucinella Architects, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [34, 35], "group": "MCA · Mario Cucinella Architects", "blur": false, "en": {"title": "Bologna Business School", "sub": "Variant to the final design", "info": [["LOCATION · YEAR", "Bologna · 2024"], ["PRACTICE", "Mario Cucinella Architects"], ["PHASE", "Variant to the final design"], ["ROLE", "Architect · 3D modeller"], ["SCOPE", "Boundary fence and two entrance gates"]], "desc": "The project concerns a variant to the final design for the Bologna Business School. The contribution covered the 3D modelling and design needed to complete the boundary fence and the two entrance gates.", "note": "Images © MCA – Mario Cucinella Architects, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "citt", "ch": "prof", "title": "Palazzo Citterio", "sub": "Tempietto, tavolo e teche", "year": "2024", "info": [["LUOGO · ANNO", "Milano · 2024"], ["STUDIO", "Mario Cucinella Architects"], ["FASE", "Progetto e realizzazione"], ["RUOLO", "Progettista · Modellatore"], ["AMBITO", "Tempietto del cortile, tavolo della lobby, tavolo espositivo e teche"], ["RICONOSCIMENTI", "Menzione d'onore, Compasso d'Oro ADI"]], "desc": "Il progetto riguarda l'allestimento di Palazzo Citterio a Milano, nuova sede della Grande Brera. MCA ha curato il disegno del piano terra e del primo piano: il tempietto nel cortile, donato da Salone del Mobile.Milano alla Pinacoteca di Brera, il tavolo della lobby e le teche espositive. Il contributo ha riguardato l'intero progetto, in particolare la progettazione del tempietto e la modellazione dei tavoli e delle teche.", "note": "Immagini di proprietà di MCA – Mario Cucinella Architects, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [36, 37], "group": "MCA · Mario Cucinella Architects", "blur": false, "en": {"title": "Palazzo Citterio", "sub": "Pavilion, table and display cases", "info": [["LOCATION · YEAR", "Milan · 2024"], ["PRACTICE", "Mario Cucinella Architects"], ["PHASE", "Design and construction"], ["ROLE", "Architect · 3D modeller"], ["SCOPE", "Courtyard pavilion, lobby table, exhibition table and display cases"], ["AWARDS", "Honourable mention, ADI Compasso d'Oro"]], "desc": "The project concerns the fit-out of Palazzo Citterio in Milan, the new home of the Grande Brera. MCA designed the ground and first floors: the pavilion in the courtyard, donated by Salone del Mobile.Milano to the Pinacoteca di Brera, the lobby table and the display cases. The contribution spanned the whole project, in particular the design of the pavilion and the 3D modelling of the tables and display cases.", "note": "Images © MCA – Mario Cucinella Architects, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "mameli", "ch": "prof", "title": "Caserma Mameli", "sub": "Concorso di architettura", "year": "2024", "info": [["LUOGO · ANNO", "Milano · 2024"], ["STUDIO", "Mario Cucinella Architects"], ["FASE", "Concorso di architettura"], ["RUOLO", "Progettista · Team member"], ["AMBITO", "Residenze, studentato, polo universitario, parco"]], "desc": "Progetto per il riuso dell'area delle ex Caserme Mameli a Milano. La proposta prevede la riqualificazione dell'intero comparto: nuove residenze, uno studentato e un nuovo polo universitario, il recupero delle ex caserme nel rispetto della loro identità architettonica e un nuovo parco al centro dell'area di intervento.", "note": "Immagini di proprietà di MCA – Mario Cucinella Architects, protette da copyright. Le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [38, 39], "group": "MCA · Mario Cucinella Architects", "blur": true, "en": {"title": "Caserma Mameli", "sub": "Architecture competition", "info": [["LOCATION · YEAR", "Milan · 2024"], ["PRACTICE", "Mario Cucinella Architects"], ["PHASE", "Architecture competition"], ["ROLE", "Architect · Team member"], ["SCOPE", "Housing, student residence, university campus, park"]], "desc": "A proposal for the reuse of the former Mameli Barracks in Milan. The scheme regenerates the whole site: new housing, a student residence and a new university hub, the restoration of the historic barracks with respect for their architectural identity, and a new park at the heart of the area.", "note": "Images © MCA – Mario Cucinella Architects, protected by copyright. The images cannot be shown and have been deliberately blurred."}}, {"id": "bert", "ch": "prof", "title": "Residenze Bertalia Lazzaretto", "sub": "Edilizia residenziale sociale", "year": "2025", "info": [["LUOGO · ANNO", "Bologna · 2025"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso di progettazione · progetto vincitore"], ["RUOLO", "Progettista · Team member, nella fase successiva al concorso"], ["AMBITO", "Masterplan, edilizia residenziale sociale"]], "desc": "Progetto per un nuovo complesso di edilizia residenziale sociale nel comparto Bertalia-Lazzaretto, nel quartiere Navile, a nord-ovest di Bologna. Il progetto trasforma l'area destinata a parcheggio in un cortile urbano pedonale, cuore di una nuova comunità aperta al quartiere e collegata alla greenway lungo il canale della Ghisiliera. Gli edifici, con basamento porticato in legno a vista, corpo a C o a L e coronamento con serre urbane di comunità, si articolano attorno al cortile con volumi frammentati e facciate dalle cromie ispirate al centro storico di Bologna. Strutture in legno e componenti prefabbricati, secondo la logica del Design for Manufacturing and Assembly, puntano a prestazioni oltre lo standard nZEB. Il contributo ha riguardato lo sviluppo del progetto dopo la vittoria del concorso.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [40, 41], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Residenze Bertalia Lazzaretto", "sub": "Social housing", "info": [["LOCATION · YEAR", "Bologna · 2025"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Design competition · winning project"], ["ROLE", "Architect · Team member, post-competition phase"], ["SCOPE", "Masterplan, social housing"]], "desc": "A new social housing complex in the Bertalia-Lazzaretto district, in the Navile neighbourhood in north-west Bologna. The project turns land earmarked for parking into a car-free urban courtyard: the heart of a new community, open to the neighbourhood and linked to the greenway along the Ghisiliera canal. The buildings, each with a timber-framed arcade at ground level, a C- or L-shaped body and a crown of shared urban greenhouses, gather around the courtyard as fragmented volumes, with façade colours drawn from Bologna's historic centre. Timber structures and prefabricated components, following a Design for Manufacturing and Assembly approach, aim for performance beyond the nZEB standard. The contribution focused on developing the project after the competition was won.", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "mase", "ch": "prof", "title": "MASE", "sub": "Nuova sede del Ministero dell'Ambiente e della Sicurezza Energetica", "year": "2025", "info": [["LUOGO · ANNO", "Roma · 2025"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso di progettazione · Agenzia del Demanio"], ["RUOLO", "Team member"], ["AMBITO", "Edificio pubblico per uffici"], ["TEAM", "Skidmore, Owings & Merrill (SOM), a-fact, Michel Desvigne Paysagiste (MDP)"]], "desc": "Progetto per la nuova sede del Ministero dell'Ambiente e della Sicurezza Energetica, nel compendio demaniale di viale Boston, all'EUR di Roma. Il progetto ricostruisce i bordi dell'isolato e rafforza le direttrici del quartiere razionalista: una serie di barre allungate ruota attorno al perimetro e racchiude un cortile centrale, con logge verdi, terrazze giardino e un piano terra permeabile, aperto alla città. La struttura ibrida, con travi in legno lamellare e solai prefabbricati, riduce le emissioni di CO2; l'edificio punta agli standard NZEB, LEED Platino e WELL Platino.", "note": "Immagini di proprietà del gruppo di progettazione (SOM, a-fact, MDP), protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [42, 43], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "MASE", "sub": "New headquarters for the Italian Ministry of Environment and Energy Security", "info": [["LOCATION · YEAR", "Rome · 2025"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Design competition · Agenzia del Demanio"], ["ROLE", "Team member"], ["SCOPE", "Public office building"], ["TEAM", "Skidmore, Owings & Merrill (SOM), a-fact, Michel Desvigne Paysagiste (MDP)"]], "desc": "A new headquarters for the Ministry of Environment and Energy Security, on a state-owned site on viale Boston in Rome's EUR district. The project rebuilds the edges of the block and reinforces the axes of the rationalist neighbourhood: a series of elongated bars wraps around the perimeter and encloses a central courtyard, with green loggias, roof gardens and a permeable ground floor open to the city. A hybrid structure of glulam beams and precast floor slabs reduces CO2 emissions; the building targets NZEB, LEED Platinum and WELL Platinum standards.", "note": "Images © the design team (SOM, a-fact, MDP), protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "mangia", "ch": "prof", "title": "Hotel & HQ Mangia's", "sub": "Mangia's Hospitality District", "year": "2026", "info": [["LUOGO · ANNO", "Palermo · 2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Progetto definitivo"], ["RUOLO", "Team member"], ["AMBITO", "Hospitality, uffici direzionali"]], "desc": "Progetto per Mangia's Hospitality District, il nuovo polo che riunisce la sede direzionale del gruppo alberghiero Mangia's e un hotel. Il progetto trasforma un complesso di padiglioni esistenti: il fronte ad archi viene recuperato e completato da un nuovo volume vetrato rivestito in lamiera verde, mentre il padiglione curvo diventa una grande serra, giardino mediterraneo e spazio di accoglienza. Corti alberate, percorsi pedonali e un paesaggio di essenze mediterranee legano gli edifici in un sistema continuo di spazi aperti, tra uffici, hotel, ristorazione e spazi comuni.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Il progetto non è ancora stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [44, 45], "group": "a-fact · architecture factory", "blur": true, "en": {"title": "Hotel & HQ Mangia's", "sub": "Mangia's Hospitality District", "info": [["LOCATION · YEAR", "Palermo · 2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Final design"], ["ROLE", "Team member"], ["SCOPE", "Hospitality, corporate offices"]], "desc": "A new hub bringing together the headquarters of the Mangia's hotel group and a hotel. The project transforms a complex of existing pavilions: the arcaded front is restored and completed by a new glazed volume clad in green metal, while the curved pavilion becomes a large greenhouse, a Mediterranean garden and a reception space. Tree-lined courtyards, footpaths and a landscape of Mediterranean planting tie the buildings into a continuous system of open spaces linking offices, hotel, restaurants and shared areas.", "note": "Images © a-fact · architecture factory, protected by copyright. The project has not yet been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "darsena", "ch": "prof", "title": "Auditorium Darsena", "sub": "Edificio eventi dell'Autorità di Sistema Portuale · Ravenna", "year": "2025", "info": [["LUOGO · ANNO", "Ravenna · 2025"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Gara di progettazione"], ["RUOLO", "Design e Project Leader"], ["AMBITO", "Edificio pubblico per eventi"]], "desc": "Nuovo edificio eventi per l'Autorità di Sistema Portuale nella Darsena di Ravenna, affacciato sul Canale Candiano. Una piazza leggermente sopraelevata, estensione del basamento della sede esistente, ricuce la banchina con la città e accoglie un volume monolitico e inclinato, rivestito in pietra chiara con piccoli inserti riflettenti che di notte lasciano filtrare la luce. All'interno la lobby passante, rivestita da un mosaico dorato con inserti azzurri, richiama la tradizione bizantina di Ravenna; al piano primo un foyer affacciato sul canale conduce alla sala convegni da 198 posti, un volume ligneo con platea inclinata. Una copertura praticabile completa il programma, per circa 1000 mq complessivi.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [46, 47], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Auditorium Darsena", "sub": "Events building for the Port Authority · Ravenna", "info": [["LOCATION · YEAR", "Ravenna · 2025"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Design tender"], ["ROLE", "Design and Project Leader"], ["SCOPE", "Public events building"]], "desc": "A new events building for the Port Authority in Ravenna's Darsena, overlooking the Candiano Canal. A slightly raised square, extending the base of the existing headquarters, stitches the quayside back to the city and holds a monolithic, tilted volume clad in pale stone, whose small reflective inserts let light filter through at night. Inside, a through-lobby lined with a gold mosaic flecked with blue recalls Ravenna's Byzantine tradition; on the first floor, a foyer overlooking the canal leads to a 198-seat conference hall, a timber-lined volume with raked seating. An accessible roof completes the programme, for a total of about 1,000 m².", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "bias", "ch": "prof", "title": "Scuola Primaria Biassono", "sub": "Nuova scuola primaria e community centre", "year": "2025", "info": [["LUOGO · ANNO", "Biassono · 2025"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso di progettazione in due fasi"], ["RUOLO", "Team member"], ["AMBITO", "Edilizia scolastica, spazi pubblici"]], "desc": "Progetto per la nuova scuola primaria di via Locatelli a Biassono, pensata come fulcro di un nuovo community centre aperto alla città. L'edificio, allineato su via Locatelli, definisce un fronte urbano chiaro; al centro una piazza, permeabile grazie a un sistema di archi prefabbricati in laterizio che richiama la tradizione costruttiva locale, distribuisce scuola, biblioteca di quartiere e palestra polifunzionale. All'interno un paesaggio didattico fluido, tra agorà, learning corridor, laboratori e atelier, accoglie 625 alunni. Modularità e prefabbricazione secondo la logica DfMA, impianti interamente elettrici e fotovoltaico in copertura puntano a un edificio nZEB.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [48, 49], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Scuola Primaria Biassono", "sub": "New primary school and community centre", "info": [["LOCATION · YEAR", "Biassono · 2025"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Two-stage design competition"], ["ROLE", "Team member"], ["SCOPE", "Education, public space"]], "desc": "A new primary school in Biassono, conceived as the heart of a community centre open to the town. Set along the street, the building defines a clear urban front; at its centre a square, made permeable by a series of prefabricated brick arches that recall local building traditions, gives access to the school, the neighbourhood library and the multi-purpose gym. Inside, a fluid learning landscape of agora, learning corridor, labs and studios welcomes 625 pupils. Modular, prefabricated construction following DfMA principles, all-electric systems and rooftop photovoltaics aim for an nZEB building.", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "vb", "ch": "prof", "title": "Villa Bianca Houses", "sub": "Nuovo complesso residenziale nel parco", "year": "2025–26", "info": [["LUOGO · ANNO", "Roma · 2025–2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Progetto definitivo"], ["RUOLO", "Design e Project Leader"], ["AMBITO", "Residenziale, paesaggio"]], "desc": "Progetto per un nuovo complesso residenziale a Roma, in largo di Villa Bianca, nel Municipio II. Volumi compatti di quattro piani, rivestiti in toni verdi e scanditi da balconi continui e logge, si dispongono liberamente in un parco di pini e prati, lasciando il suolo il più possibile libero e permeabile. Tra gli edifici si sviluppano giardini condominiali, aree gioco e percorsi pedonali che fanno del paesaggio il centro dell'abitare; le coperture verdi e i pannelli fotovoltaici completano l'attenzione alla sostenibilità.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Il progetto non è ancora stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [50, 51], "group": "a-fact · architecture factory", "blur": true, "en": {"title": "Villa Bianca Houses", "sub": "New housing in a park", "info": [["LOCATION · YEAR", "Rome · 2025–2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Final design"], ["ROLE", "Design and Project Leader"], ["SCOPE", "Residential, landscape"]], "desc": "A new residential complex in Rome, at Largo di Villa Bianca in the city's second municipality. Compact four-storey volumes, finished in green tones and articulated by continuous balconies and loggias, stand freely in a park of pines and lawns, leaving as much ground as possible open and permeable. Shared gardens, play areas and footpaths unfold between the buildings, making the landscape the centre of everyday life; green roofs and photovoltaic panels complete the focus on sustainability.", "note": "Images © a-fact · architecture factory, protected by copyright. The project has not yet been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "monza", "ch": "prof", "title": "Residenze Memo Monza", "sub": "Monverde · complesso culturale e residenziale", "year": "2025–26", "info": [["LUOGO · ANNO", "Monza · 2025–2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso di progettazione · progetto vincitore"], ["RUOLO", "Team member"], ["AMBITO", "Masterplan, residenze, biblioteca civica"]], "desc": "Progetto per un nuovo complesso culturale e residenziale a Monza, su un'area di circa 28.000 mq in continuità con il centro storico, organizzato attorno a un parco urbano. La storica chiesa panottica, rifunzionalizzata, diventa la nuova biblioteca civica. Le Monverde Residences, un edificio a corte di linguaggio classico, completano l'isolato e definiscono una piazza minerale, misurata sull'altezza della chiesa e del portico. Nel parco emergono le Monverde Towers, due volumi su base ottagonale irregolare, cesellati per ridurne l'impatto visivo: terrazze e balconi verdi offrono a ogni appartamento esposizioni su almeno tre lati.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [52, 53], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Residenze Memo Monza", "sub": "Monverde · cultural and residential complex", "info": [["LOCATION · YEAR", "Monza · 2025–2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Design competition · winning project"], ["ROLE", "Team member"], ["SCOPE", "Masterplan, housing, civic library"]], "desc": "A new cultural and residential complex in Monza, on a site of about 28,000 m² next to the historic centre, organised around an urban park. The historic panoptic church is converted into the new civic library. The Monverde Residences, a courtyard building with a classical language, complete the block and frame a mineral square scaled to the height of the church and the arcade. In the park rise the Monverde Towers, two volumes on an irregular octagonal plan, carved to reduce their visual impact: green terraces and balconies give every apartment views on at least three sides.", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "carc", "ch": "prof", "title": "Residenze Carcani Roma", "sub": "Carcani 61 · riconversione residenziale", "year": "2025–26", "info": [["LUOGO · ANNO", "Roma · 2025–2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso privato COIMA · progetto vincitore"], ["RUOLO", "Project Leader"], ["AMBITO", "Riqualificazione, residenziale"]], "desc": "Progetto per la riconversione in residenze di un edificio direzionale degli anni Settanta in via Carcani, a Roma, tra Trastevere, Monteverde e Porta Portese. Il progetto ridà regola e misura a un volume lungo quasi cento metri: un sistema modulare di logge, terrazze e balconi verdi, che reinterpreta la tradizione della palazzina romana, ne scandisce i fronti in ordini proporzionati. Il piano terra si apre con una hall centrale e diventa un club residenziale affacciato su una nuova piazza verde; il coronamento, ripensato come attico arretrato, accoglie una roof terrace condominiale.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Il progetto non è ancora stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [54, 55], "group": "a-fact · architecture factory", "blur": true, "en": {"title": "Residenze Carcani Roma", "sub": "Carcani 61 · residential conversion", "info": [["LOCATION · YEAR", "Rome · 2025–2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Private COIMA competition · winning project"], ["ROLE", "Project Leader"], ["SCOPE", "Regeneration, residential"]], "desc": "The conversion of a 1970s office building on via Carcani in Rome, between Trastevere, Monteverde and Porta Portese, into housing. The project brings order and proportion back to a volume almost a hundred metres long: a modular system of loggias, terraces and planted balconies, reinterpreting the tradition of the Roman palazzina, divides its façades into well-proportioned orders. At ground level a central hall opens the building up, becoming a residents' club facing a new green square; the top floor, redesigned as a setback penthouse level, holds a shared roof terrace.", "note": "Images © a-fact · architecture factory, protected by copyright. The project has not yet been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "colo", "ch": "prof", "title": "Student Housing Cologno", "sub": "COVO Student Living · riconversione", "year": "2025–26", "info": [["LUOGO · ANNO", "Cologno Monzese · 2025–2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Progetto architettonico e definitivo"], ["RUOLO", "Design e Project Leader"], ["AMBITO", "Riqualificazione, student housing"]], "desc": "Riconversione di un edificio direzionale a Cologno Monzese in una struttura ricettiva per studenti, con 627 camere e spazi comuni condivisi. Il progetto opera in continuità con il costruito, senza alterarne geometria e volumetria: l'involucro diventa l'elemento chiave dell'intervento. L'attuale curtain wall è sostituito da una nuova facciata di pannelli prefabbricati rivestiti da elementi tridimensionali in metallo, con superfici vetrate ridotte e rimodulate; il pattern geometrico mitiga la percezione monumentale dell'edificio e cambia aspetto con la luce del giorno. Completano l'intervento la riqualificazione delle aree esterne e del verde e il percorso di certificazione LEED.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Il progetto non è ancora stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [56, 57], "group": "a-fact · architecture factory", "blur": true, "en": {"title": "Student Housing Cologno", "sub": "COVO Student Living · conversion", "info": [["LOCATION · YEAR", "Cologno Monzese · 2025–2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Architectural and final design"], ["ROLE", "Design and Project Leader"], ["SCOPE", "Regeneration, student housing"]], "desc": "The conversion of an office building in Cologno Monzese into student accommodation, with 627 rooms and shared common spaces. The project works with the existing building, leaving its geometry and volume unchanged: the envelope becomes the key element of the intervention. The existing curtain wall is replaced by a new façade of prefabricated panels clad in three-dimensional metal elements, with reduced and reorganised glazing; the geometric pattern softens the building's monumental presence and changes appearance with the daylight. The renewal of the outdoor spaces and planting and a LEED certification process complete the project.", "note": "Images © a-fact · architecture factory, protected by copyright. The project has not yet been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "surf", "ch": "prof", "title": "Surf Park Wavegarden", "sub": "Wavegarden Cove Milano · Westfield", "year": "2026", "info": [["LUOGO · ANNO", "Segrate · 2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso di progettazione · progetto vincitore"], ["RUOLO", "Team member"], ["AMBITO", "Hospitality"]], "desc": "Progetto per il Wavegarden Cove Milano, il surf park accanto al Westfield di Segrate, nel paesaggio d'acqua dell'est milanese. Il progetto immagina un'oasi protetta, un'eterotopia delle attività legate al mare: le geometrie dei due bacini per le onde artificiali e i margini del lotto generano le linee del landscape e degli edifici, che richiamano le onde e le curve delle tavole da surf. L'Hub, con ristorante panoramico e una grande vetrata protetta da ampi aggetti, si affaccia sulla laguna; a nord il Beach Club, per circa 500 persone, alterna piscine, deck in legno, prati e vegetazione in un paesaggio su più livelli.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [58, 59], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Surf Park Wavegarden", "sub": "Wavegarden Cove Milano · Westfield", "info": [["LOCATION · YEAR", "Segrate · 2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Design competition · winning project"], ["ROLE", "Team member"], ["SCOPE", "Hospitality"]], "desc": "A project for Wavegarden Cove Milano, the surf park next to Westfield in Segrate, within the water landscape east of Milan. It imagines a sheltered oasis, a heterotopia of seaside activities: the geometry of the two artificial-wave lagoons and the edges of the site generate the lines of both landscape and buildings, which echo the shape of waves and the curves of surfboards. The Hub, with a panoramic restaurant and a large glazed front shaded by deep overhangs, looks onto the lagoon; to the north, the Beach Club, for about 500 people, alternates pools, timber decks, lawns and planting across several levels.", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}, {"id": "pisa", "ch": "prof", "title": "Marina di Pisa Development", "sub": "Piano di Recupero dell'area ex Motofides", "year": "2026", "info": [["LUOGO · ANNO", "Marina di Pisa · 2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Masterplan e progettazione architettonica"], ["RUOLO", "Design e Project Leader"], ["AMBITO", "Residenziale, fronte portuale"]], "desc": "Recupero dell'ex area Motofides a Marina di Pisa, lungo il fronte meridionale del nuovo porto turistico, alla foce dell'Arno. Il progetto reinterpreta proporzioni, scala e tipologie della città storica in un fronte urbano unitario ma non uniforme, fatto di corpi edilizi riconoscibili, accostati e differenziati. I portali esistenti vengono ampliati come prosecuzione della trama urbana verso il bacino portuale e tre nuovi varchi aprono passaggi e visuali tra la strada e il porto; le testate più alte segnano gli ingressi al porto. Gli edifici, prevalentemente residenziali, ospitano 32 unità con logge e terrazze e spazi commerciali al piano terra.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Il progetto non è ancora stato presentato pubblicamente: le immagini non possono essere mostrate e sono qui volutamente sfocate.", "pages": [60, 61], "group": "a-fact · architecture factory", "blur": true, "en": {"title": "Marina di Pisa Development", "sub": "Recovery plan for the former Motofides site", "info": [["LOCATION · YEAR", "Marina di Pisa · 2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "Masterplan and architectural design"], ["ROLE", "Design and Project Leader"], ["SCOPE", "Residential, harbour front"]], "desc": "The regeneration of the former Motofides site in Marina di Pisa, along the southern edge of the new marina at the mouth of the Arno. The project reinterprets the proportions, scale and building types of the historic town in a unified yet varied urban front, made of distinct buildings set side by side. Existing gateways are widened to carry the street grid through to the harbour basin, and three new openings create passages and views between the street and the marina; taller end buildings mark the entrances to the harbour. The mainly residential buildings contain 32 homes with loggias and terraces, with shops on the ground floor.", "note": "Images © a-fact · architecture factory, protected by copyright. The project has not yet been publicly presented, so the images cannot be shown and have been deliberately blurred."}}, {"id": "pod", "ch": "prof", "title": "Contact Zone Podgorica", "sub": "Location 7 · nuovo quartiere sul fiume Morača", "year": "2026", "info": [["LUOGO · ANNO", "Podgorica, Montenegro · 2026"], ["STUDIO", "a-fact · architecture factory"], ["FASE", "Concorso internazionale · progetto vincitore"], ["RUOLO", "Project Leader, nella fase successiva al concorso"], ["AMBITO", "Commerciale, uffici"]], "desc": "Concept urbano e architettonico per la Location 7 a Podgorica, tra le colline di Gorica e Malo Brdo, affacciata sul fiume Morača. Il nuovo quartiere prolunga l'Arts & Culture Park fino al fiume: una piattaforma verde continua collega collina, parco, podio e lungofiume, mentre un podio commerciale, integrato nel terreno, scende verso la passeggiata sul fiume. Dal paesaggio emergono tre volumi esagonali, scolpiti come rocce modellate dalla natura, attorno a una piazza centrale. Il contributo ha riguardato lo sviluppo del progetto nella seconda fase, dopo la vittoria del concorso.", "note": "Immagini di proprietà di a-fact · architecture factory, protette da copyright. Le immagini sono riprodotte a soli fini di documentazione del contributo personale.", "pages": [62, 63], "group": "a-fact · architecture factory", "blur": false, "en": {"title": "Contact Zone Podgorica", "sub": "Location 7 · a new district on the Morača river", "info": [["LOCATION · YEAR", "Podgorica, Montenegro · 2026"], ["PRACTICE", "a-fact · architecture factory"], ["PHASE", "International competition · winning project"], ["ROLE", "Project Leader, post-competition phase"], ["SCOPE", "Retail, offices"]], "desc": "An urban and architectural concept for Location 7 in Podgorica, between the Gorica and Malo Brdo hills, facing the Morača river. The new district extends the Arts & Culture Park down to the water: a continuous green platform links hill, park, podium and riverside, while a retail podium, embedded in the terrain, steps down towards the river promenade. Three hexagonal volumes rise from the landscape around a central plaza, carved like rocks shaped by natural forces. The contribution focused on developing the project in the second phase, after the competition was won.", "note": "Images © a-fact · architecture factory, protected by copyright. Reproduced solely to document the author's personal contribution."}}];

   ${g.g?`<div class="grp"><span class="cond">${esc(GROUPS[g.g]?GROUPS[g.g][L]:g.g)}</span><span class="mono" style="color:var(--mute)">${g.items.length}</span></div>`:'<div style="height:clamp(32px,4vw,48px)"></div>'}
   <div class="grid">${g.items.map(p=>{const ims=(REND[p.id]||[1]).map(k=>(GAL[p.id]&&GAL[p.id][k-1])?GAL[p.id][k-1][0]:'img/'+p.id+'.jpg');return `<div class="card" role="link" tabindex="0" data-id="${p.id}" aria-label="${esc(D(p).title)}">
     <div class="im sld"><div class="trk">${ims.map((s,k)=>`<img src="${s}" alt="" ${k?'loading="lazy"':''}>`).join('')}</div>
      ${ims.length>1?`<button class="cn p" data-c="-1" aria-label="${t.prev}">←</button><button class="cn n" data-c="1" aria-label="${t.next}">→</button><span class="cd">${ims.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</span>`:''}<span class="go mono">${t.open}</span></div>
     <div class="meta"><h3>${esc(D(p).title)}</h3><span class="yr">${esc(p.year)}</span><span class="sub">${esc(D(p).sub)}</span></div>
     <span class="pr">${roleOf(p)?esc(roleOf(p)).toUpperCase()+' · ':''}${t.pp} ${p.pages[0]}–${p.pages[p.pages.length-1]}</span>
   </div>`}).join('')}</div>`).join('')}
  </div></section>`}).join('');
 setupGeo();if(typeof cardsFx==='function')cardsFx();
}
function applyLang(){
 document.documentElement.lang=L;const t=T[L];
 document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(t[k]!==undefined)el.textContent=t[k]});
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===L)));
 renderChapters();
 if(ov){const id=ov.dataset.id;id==='cv'?openCV(false):openP(id,false)}
 try{localStorage.setItem('nc-lang',L)}catch(e){}
}
